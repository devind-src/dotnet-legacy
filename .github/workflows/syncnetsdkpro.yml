name: SyncNetSdkPro

on:
  push:
    branches: [main]
    tags: ['sdkpro-v*', 'routing-v*']
    paths:
      - 'SyncNetSdkPro/**'
      - 'SyncNetSdk/**'
      - '.github/workflows/syncnetsdkpro.yml'
  pull_request:
    paths:
      - 'SyncNetSdkPro/**'
      - 'SyncNetSdk/**'
      - '.github/workflows/syncnetsdkpro.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: SyncNetSdkPro

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer membutuhkan riwayat tag

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: SyncNetSdkPro/global.json

      - name: Build
        run: dotnet build SyncNetSdkPro.slnx -c Release

      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER sdkpro WITH PASSWORD 'sdkpro' SUPERUSER;" -c "CREATE DATABASE sdkpro_test OWNER sdkpro;"
          echo "SYNCNET_TEST_PG=Host=127.0.0.1;Database=sdkpro_test;Username=sdkpro;Password=sdkpro" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test --solution SyncNetSdkPro.slnx -c Release --no-build

  golden-check:
    # Golden file harus identik dengan output SDK lama; gagal bila ada yang tidak sinkron.
    name: Golden files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: SyncNetSdkPro/global.json
      - name: Start PostgreSQL (golden resolver routing)
        working-directory: .
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER sdkpro WITH PASSWORD 'sdkpro' SUPERUSER;" -c "CREATE DATABASE sdkpro_test OWNER sdkpro;"
          echo "SYNCNET_TEST_PG=Host=127.0.0.1;Database=sdkpro_test;Username=sdkpro;Password=sdkpro" >> "$GITHUB_ENV"
      - name: Regenerate from legacy SyncNetSdk
        run: dotnet run --project tools/SyncNetPro.GoldenGenerator -c Release
      - name: Verify no diff
        run: >
          git diff --exit-code --
          tests/SyncNetPro.Contracts.Tests/Golden tests/SyncNetPro.Sdk.Tests/Golden tests/SyncNetPro.Iso8583.Tests/Golden
          tests/SyncNetPro.Toolkit.Tests/Golden tests/SyncNetPro.Hsm.Tests/Golden tests/SyncNetPro.Routing.Tests/Golden

  publish:
    # sdkpro-v*  : semua paket SDK kecuali SyncNetPro.Routing
    # routing-v* : hanya SyncNetPro.Routing (versi independen, keputusan Q6); dependensi SyncNetPro.Sdk/Contracts
    #              dipatok ke tag sdkpro-v* terakhir agar selalu menunjuk versi yang sudah dipublikasikan.
    name: Publish to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/sdkpro-v') || startsWith(github.ref, 'refs/tags/routing-v')
    needs: [build-test, golden-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: SyncNetSdkPro/global.json
      - name: Pack SDK
        if: startsWith(github.ref, 'refs/tags/sdkpro-v')
        run: |
          dotnet pack SyncNetSdkPro.slnx -c Release -o artifacts
          rm -f artifacts/SyncNetPro.Routing.*
      - name: Pack Routing
        if: startsWith(github.ref, 'refs/tags/routing-v')
        run: |
          SDK_TAG=$(git describe --tags --match 'sdkpro-v*' --abbrev=0)
          dotnet pack src/SyncNetPro.Routing/SyncNetPro.Routing.csproj -c Release -o artifacts -p:SdkReleaseVersion=${SDK_TAG#sdkpro-v}
          find artifacts -name '*.nupkg' ! -name 'SyncNetPro.Routing.*' -delete
      - name: Push
        working-directory: SyncNetSdkPro/artifacts
        run: >
          dotnet nuget push "*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
